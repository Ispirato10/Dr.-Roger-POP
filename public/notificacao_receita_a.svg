  <text x="25" y="420" font-family="sans-serif" font-size="7.5" fill="#555500">DADOS DA GRÁFICA AUTORIZADA: Artes Gráficas Rio Bom S/A - CNPJ 12.345.678/0001-90 - 50 blocos de 50 fls - Autorização Vigilância Sanitária No. 543/2022 - PR</text>
