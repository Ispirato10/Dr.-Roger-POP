  <text x="460" y="230" font-family="'Courier New', monospace, sans-serif" font-size="10" font-weight="bold" fill="#000000">CARIMBO DO FORNECEDOR (DE DISPENSAÇÃO):</text>
  
  <line x1="460" y1="262" x2="770" y2="262" stroke="#003366" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="460" y="255" font-family="'Courier New', monospace, sans-serif" font-size="9" fill="#004488">Nome da Farmácia UBS Central:</text>

  <line x1="460" y1="305" x2="600" y2="305" stroke="#003366" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="460" y="298" font-family="'Courier New', monospace, sans-serif" font-size="9" fill="#004488">Nome do vendedor/responsável:</text>

  <line x1="615" y1="305" x2="770" y2="305" stroke="#003366" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="615" y="298" font-family="'Courier New', monospace, sans-serif" font-size="9" fill="#004488">Data da Dispensação:</text>

  <!-- Signatures Line -->
  <line x1="460" y1="355" x2="770" y2="355" stroke="#003366" stroke-width="1"/>
  <text x="615" y="367" font-family="'Courier New', monospace, sans-serif" font-size="8.5" fill="#003366" text-anchor="middle">Assinatura do Farmacêutico / carimbo</text>

  <!-- Gráfica Footer text -->
  <text x="25" y="420" font-family="sans-serif" font-size="7.5" fill="#003366">DADOS DA GRÁFICA AUTORIZADA: Artes Gráficas Rio Bom S/A - CNPJ 12.345.678/0001-90 - Autorização Vigilância Sanitária No. 543/2022 - PR</text>
  <text x="25" y="440" font-family="sans-serif" font-size="7.5" fill="#003366">Validade estrita de 30 dias após emissão. Legítima somente nesta Unidade Federativa.</text>
  
  <text x="770" y="460" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="end">Série B - No. 049582</text>
</svg>
