<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#D7EDFF" stroke="#006699" stroke-width="4" rx="8"/>
  
  <!-- Outer border outline -->
  <rect x="15" y="15" width="770" height="470" fill="none" stroke="#003366" stroke-width="1.5" rx="4"/>

