<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Green Cross -->
  <rect x="231" y="60" width="50" height="180" rx="10" fill="#22c55e" stroke="white" stroke-width="8"/>
  <rect x="166" y="125" width="180" height="50" rx="10" fill="#22c55e" stroke="white" stroke-width="8"/>

  <!-- Main Text -->
  <text x="50%" y="300" font-family="Arial, sans-serif" font-size="64" fill="white" text-anchor="middle" font-weight="900" letter-spacing="-1">Dr. Roger</text>
  
  <!-- POP text with colors -->
  <g transform="translate(256, 380)">
    <rect x="-140" y="-50" width="80" height="80" rx="15" fill="#3b82f6" stroke="white" stroke-width="4"/>
    <text x="-100" y="5" font-family="Arial, sans-serif" font-size="60" fill="white" text-anchor="middle" font-weight="900">P</text>
    
    <rect x="-40" y="-50" width="80" height="80" rx="15" fill="#eab308" stroke="white" stroke-width="4"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="60" fill="white" text-anchor="middle" font-weight="900">O</text>
    
    <rect x="60" y="-50" width="80" height="80" rx="15" fill="#ef4444" stroke="white" stroke-width="4"/>
    <text x="100" y="5" font-family="Arial, sans-serif" font-size="60" fill="white" text-anchor="middle" font-weight="900">P</text>
  </g>

  <!-- Farma text -->
  <rect x="156" y="420" width="200" height="50" rx="25" fill="#22c55e" stroke="white" stroke-width="4"/>
  <text x="50%" y="456" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="900">FARMA</text>
</svg>
